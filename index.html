<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream en Vivo - Mistra998</title>
    <style>
        /* Usamos flexbox en el body para dividir la pantalla */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: black; 
            overflow: hidden; 
            display: flex; 
        }
        
        /* El contenedor del video ocupa todo el espacio izquierdo */
        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tu video se adapta a su contenedor */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        /* El contenedor del chat clavado a la derecha */
        .chat-container {
            width: 350px; 
            border-left: 1px solid #333;
        }

        /* El chat ocupa todo su cuadradito */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media screen and (max-width: 768px) {
        body { 
            display: flex;
            flex-direction: column !important; 
        }
        video {
            width: 100% !important;
            height: 35vh !important;
            object-fit: contain;
        }
        .chat-container {
            width: 100% !important;
            height: 65vh !important;
        }
        .chat-container iframe {
            width: 100% !important;
            height: 100% !important;
        }
    }
    </style>
    <!-- Llama al reproductor HLS.js directo de internet -->
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
</head>
<body>

  <!-- CAJA DEL VIDEO -->
<div class="video-container">
    <div id="player" style="width: 100%; height: 100%;"></div>
</div>

    <!-- CAJA DEL CHAT -->
    <div class="chat-container">
        <iframe src="https://www.twitch.tv/embed/mistra887/chat?parent=mistra998.github.io" frameborder="0"></iframe>
    </div>

    
    <!-- SCRIPT DEL REPRODUCTOR CLAPPR -->
    <script>
        // Tu link de MediaMTX saliendo por Cloudflare
        var streamURL = "https://basis-priorities-reprint-arthritis.trycloudflare.com/mistra/index.m3u8";

        var player = new Clappr.Player({
            source: streamURL,
            parentId: "#player",
            autoPlay: true,
            mute: true,
            width: '100%',
            height: '100%',
            playback: {
                hlsjsConfig: {
                    liveSyncDurationCount: 8,
                    liveMaxLatencyDurationCount: 20, 
                    maxBufferLength: 30
                }
            }
        });
    </script>
