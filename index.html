<!DOCTYPE html>
<html lang="es">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream en Vivo - Mistra998</title>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
    <style>
        /* Usamos flexbox en el body para dividir la pantalla */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: black; 
            overflow: hidden; 
            display: flex; 
        }
        
        /* El contenedor del video ocupa todo el espacio izquierdo */
        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tu video se adapta a su contenedor */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        /* El contenedor del chat clavado a la derecha */
        .chat-container {
            width: 350px; 
            border-left: 1px solid #333;
        }

        /* El chat ocupa todo su cuadradito */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
       @media screen and (max-width: 768px) {
    .video-container video, 
    .plyr {
        object-fit: cover !important; /* Esto hace que la imagen se estire/haga zoom para llenar el cuadro */
        width: 100% !important;
        height: 100% !important;
    }
        }
        .chat-container {
            width: 100% !important;
            height: 65vh !important;
        }
        .chat-container iframe {
            width: 100% !important;
            height: 100% !important;
        }
    }
    </style>
    <!-- Llama al reproductor HLS.js directo de internet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
</head>
<body>
    <style> body { padding-top: 36px; box-sizing: border-box; height: 100vh; margin: 0; overflow: hidden; } </style>
    <!-- BARRA SUPERIOR CON LOGO ESTATICO -->
    <div style="position: absolute; top: 0; left: 0; width: 100%; background-color: #121212; padding: 5px 15px; box-sizing: border-box; border-bottom: 2px solid #8a2be2; z-index: 999;">
        <img src="logo.png" alt="Mistra998" style="height: 28px; display: block;">
    </div>

  <!-- CAJA DEL VIDEO -->
<div class="video-container">
    <video id="mistra-player" controls autoplay playsinline muted style="width: 100%; height: 100%; object-fit: contain; background: black;"></video>
</div>
    <!-- CAJA DEL CHAT -->
    <div class="chat-container">
        <iframe src="https://www.twitch.tv/embed/mistra887/chat?parent=mistra998.github.io&darkpopout" frameborder="0"></iframe>
    </div>

<!-- Librerías de HLS.js y Plyr -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

<script>
    var video = document.getElementById('mistra-player');
    var streamURL = atob("aHR0cHM6Ly9nbm9tZS1ldmFsdWF0ZS1jb250cm9sbGVkLWNvbnRhaW5lci50cnljbG91ZGZsYXJlLmNvbS9taXN0cmEvaW5kZXgubTN1OA==");

    if (Hls.isSupported()) {
        var hls = new Hls({
            liveSyncDurationCount: 2,
            lowLatencyMode: true,
            maxLiveSyncPlaybackRate: 1.5
        });
        hls.loadSource(streamURL);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(() => {
                video.muted = true;
                video.play();
            });
        });

        // Inicializamos Plyr sobre el video apenas carga el stream
        hls.on(Hls.Events.MEDIA_ATTACHED, function () {
            const player = new Plyr(video, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'pip', 'fullscreen'],
                live: true
            });
        });
        
        // Manejo de errores y reconexión automática con cuenta regresiva
        hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
                switch(data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;
                    default:
                        hls.destroy();
                        
                        let overlay = document.getElementById('reconnect-overlay');
                        if (!overlay) {
                            overlay = document.createElement('div');
                            overlay.id = 'reconnect-overlay';
                            overlay.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; font-family: sans-serif; text-align: center;';
                            document.querySelector('.video-container').appendChild(overlay);
                        }
                        
                        let segundos = 5;
                        overlay.innerHTML = `
                            <h3 style="margin: 0 0 10px 0; color: #ff4444; font-size: 22px;">⚠️ Señal caída temporalmente</h3>
                            <p style="margin: 0; font-size: 16px;">Reconectando automáticamente en <span id="contador-seg" style="font-weight: bold; color: #00ffcc; font-size: 24px;">${segundos}</span> segundos...</p>
                        `;
                        
                        let timer = setInterval(() => {
                            segundos--;
                            let contadorSpan = document.getElementById('contador-seg');
                            if (contadorSpan) {
                                contadorSpan.innerText = segundos;
                            }
                            
                            if (segundos <= 0) {
                                clearInterval(timer);
                                if (overlay) overlay.remove();
                                location.reload();
                            }
                        }, 1000);
                        break;
                }
            }
        });
    }
</script>

<!-- Seguridad: Bloquear clic derecho y F12 -->
<script>
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.onkeydown = function(e) {
        if(e.keyCode == 123) { return false; }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
    }
</script>

<!-- Registro de la PWA (Service Worker) -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
