<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistra998 - Live Stream</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #121212;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* Barra superior */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 36px;
            background-color: #121212;
            padding: 4px 15px;
            border-bottom: 2px solid #8a2be2;
            z-index: 999;
            display: flex;
            align-items: center;
        }
        .top-bar img {
            height: 28px;
            display: block;
        }
        /* Contenedor principal de la transmisión y el chat */
        .main-container {
            display: flex;
            width: 100%;
            height: calc(100vh - 36px);
            margin-top: 36px;
        }
        .video-container {
            flex: 1;
            height: 100%;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
        .chat-container {
            width: 380px;
            height: 100%;
            background: #18181b;
            border-left: 1px solid #2f2f35;
        }
        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Diseño adaptable para celulares */
        @media screen and (max-width: 768px) {
            .main-container {
                flex-direction: column !important;
            }
            .video-container {
                width: 100% !important;
                height: 35vh !important;
                flex: none !important;
            }
            .chat-container {
                width: 100% !important;
                height: 65vh !important;
                flex: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
        <img src="logo.png" alt="Mistra998">
    </div>

    <!-- CONTENEDOR DE VIDEO Y CHAT -->
    <div class="main-container">
        <div class="video-container">
            <video id="mistra-player" controls autoplay playsinline muted></video>
        </div>
        <div class="chat-container">
            <iframe src="https://www.twitch.tv/embed/mistra887/chat?parent=mistra998.github.io&darkpopout"></iframe>
        </div>
    </div>

    <!-- SCRIPT DE HLS.JS (Directo, sin tirones y ultrarrápido) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        var video = document.getElementById('mistra-player');
        var streamURL = atob("aHR0cHM6Ly9nbm9tZS1ldmFsdWF0ZS1jb250cm9sbGVkLWNvbnRhaW5lci50cnljbG91ZGZsYXJlLmNvbS9taXN0cmEvaW5kZXgubTN1OA==");

        if (Hls.isSupported()) {
            var hls = new Hls({
                liveSyncDurationCount: 2,
                lowLatencyMode: true,
                maxLiveSyncPlaybackRate: 1.5
            });
            hls.loadSource(streamURL);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => {
                    video.muted = true;
                    video.play();
                });
            });

            // Manejo de errores y cuenta regresiva automática si cae la señal
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            
                            let overlay = document.getElementById('reconnect-overlay');
                            if (!overlay) {
                                overlay = document.createElement('div');
                                overlay.id = 'reconnect-overlay';
                                overlay.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; font-family: sans-serif; text-align: center;';
                                document.querySelector('.video-container').appendChild(overlay);
                            }
                            
                            let segundos = 5;
                            overlay.innerHTML = `
                                <h3 style="margin: 0 0 10px 0; color: #ff4444; font-size: 22px;">⚠️ Señal caída temporalmente</h3>
                                <p style="margin: 0; font-size: 16px;">Reconectando automáticamente en <span id="contador-seg" style="font-weight: bold; color: #00ffcc; font-size: 24px;">${segundos}</span> segundos...</p>
                            `;
                            
                            let timer = setInterval(() => {
                                segundos--;
                                let contadorSpan = document.getElementById('contador-seg');
                                if (contadorSpan) contadorSpan.innerText = segundos;
                                
                                if (segundos <= 0) {
                                    clearInterval(timer);
                                    if (overlay) overlay.remove();
                                    location.reload();
                                }
                            }, 1000);
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamURL;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

    <!-- Seguridad: Bloquear clic derecho y F12 -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
        }
    </script>

    <!-- Registro de la PWA (Service Worker) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>

</body>
</html>
