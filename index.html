<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stream en Vivo - Mistra998</title>
    <style>
        /* Usamos flexbox en el body para dividir la pantalla */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: black; 
            overflow: hidden; 
            display: flex; 
        }
        
        /* El contenedor del video ocupa todo el espacio izquierdo */
        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tu video se adapta a su contenedor */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        /* El contenedor del chat clavado a la derecha */
        .chat-container {
            width: 350px; 
            border-left: 1px solid #333;
        }

        /* El chat ocupa todo su cuadradito */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @media screen and (max-width: 768px) {
        body { 
            display: flex;
            flex-direction: column !important; 
        }
        video {
            width: 100% !important;
            height: 35vh !important;
            object-fit: contain;
        }
        .chat-container {
            width: 100% !important;
            height: 65vh !important;
        }
        .chat-container iframe {
            width: 100% !important;
            height: 100% !important;
        }
    }
    </style>
    <!-- Llama al reproductor HLS.js directo de internet -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- CAJA DEL VIDEO -->
    <div class="video-container">
        <video id="video" controls autoplay muted></video>
    </div>

    <!-- CAJA DEL CHAT -->
    <div class="chat-container">
        <iframe src="https://www.twitch.tv/embed/mistra887/chat?parent=mistra998.github.io" frameborder="0"></iframe>
    </div>

    <!-- SCRIPT ORIGINAL DEL REPRODUCTOR -->
    <script>
        var video = document.getElementById('video');
        
        // Tu link de MediaMTX saliendo por DuckDNS
        var streamURL = "https://deadline-minority-cover-licence.trycloudflare.com/mistra/index.m3u8";

       if (Hls.isSupported()) {
     var hls = new Hls();
     hls.loadSource(streamURL);
        hls.loadSource(streamURL);
        hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Soporte para Safari o iOS
            video.src = streamURL;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
